<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense &amp; Budget Visualizer</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>Expense &amp; Budget Visualizer</h1>
    <button id="theme-toggle" type="button">Dark Mode</button>
    <div id="balance-display">
      <span id="balance-value">$0.00</span>
    </div>
  </header>

  <main>
    <section id="form-section">
      <form id="transaction-form">
        <div class="field-group">
          <label for="item-name">Item Name</label>
          <input id="item-name" type="text" maxlength="100" placeholder="e.g. Lunch" />
          <span class="error" id="item-name-error"></span>
        </div>
        <div class="field-group">
          <label for="amount">Amount</label>
          <input id="amount" type="number" step="0.01" placeholder="0.00" />
          <span class="error" id="amount-error"></span>
        </div>
        <div class="field-group">
          <label for="category">Category</label>
          <select id="category">
            <option value="">-- Select Category --</option>
            <option value="Food">Food</option>
            <option value="Transport">Transport</option>
            <option value="Fun">Fun</option>
          </select>

          <div class="custom-category">
            <input
              id="custom-category"
              type="text"
              maxlength="30"
              placeholder="Add custom category"
            />
            <button type="button" id="add-category-btn">Add Category</button>
          </div>

          <span class="error" id="category-error"></span>
        </div>
        <button type="submit">Add Transaction</button>
      </form>
    </section>

    <section id="list-section">
      <div class="sort-controls">
        <select id="sort-select">
          <option value="default">Default</option>
          <option value="amount-asc">Amount: Low to High</option>
          <option value="amount-desc">Amount: High to Low</option>
          <option value="category">Category</option>
        </select>
      </div>
      <ul id="transaction-list"></ul>
      <p id="empty-message" hidden>No transactions recorded yet.</p>
    </section>

    <section id="chart-section">
      <canvas id="spending-chart"></canvas>
      <p id="chart-placeholder" hidden>No spending data available.</p>
    </section>
  </main>

  <div id="toast" role="status" aria-live="polite"></div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js" onerror="handleChartLoadError()"></script>
  <script src="js/app.js"></script>
</body>
</html>
